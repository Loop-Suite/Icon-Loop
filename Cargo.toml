[package]
name = "icon-loop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Loop-Suite/icon-loop"
description = "App icon design CLI — independent lens generation, deterministic render/policy gates, fully independent blind discourse, Borda-count verdict"

[[bin]]
name = "iconloop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
ureq = { version = "3", features = ["json"] }
regex = "1"
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
